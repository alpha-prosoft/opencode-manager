name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  CHART_DIR: charts/opencode-manager

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: manager/requirements.txt
      - run: pip install -r manager/requirements.txt
      - run: python -c "import app.main, app.backends.kubernetes, app.routing, app.temporal.engine"
        working-directory: manager
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: manager/ui/package-lock.json
      - run: npm ci && npm run build
        working-directory: manager/ui

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: manager
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ github.event_name == 'pull_request' && 'type=docker,dest=/tmp/manager-image.tar' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: manager-image
          path: /tmp/manager-image.tar
          retention-days: 7

  chart:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "app_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(yq '.version' "$CHART_DIR/Chart.yaml")-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "app_version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - run: |
          helm repo add traefik https://traefik.github.io/charts
          helm repo add temporal https://go.temporal.io/helm-charts
          helm dependency build "$CHART_DIR"
      - run: helm lint "$CHART_DIR"
      - run: helm template ci "$CHART_DIR" > /dev/null
      - run: helm package "$CHART_DIR" --version ${{ steps.version.outputs.version }} --app-version ${{ steps.version.outputs.app_version }} --destination dist
      - uses: actions/upload-artifact@v7
        with:
          name: helm-chart
          path: dist/*.tgz
      - name: Push chart to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm push dist/*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
