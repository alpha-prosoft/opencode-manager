name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  CHART_DIR: charts/opencode-manager

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: opencode-manager
      - uses: actions/checkout@v7
        with:
          repository: alpha-prosoft/edd-core
          path: edd-core
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: opencode-manager/web/package-lock.json
      - name: Service unit tests
        working-directory: opencode-manager/service
        run: clojure -M:test:unit
      - name: Web build
        working-directory: opencode-manager/web
        run: npm ci && npm run fonts && clojure -M:shadow-cljs release app

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: alpha-prosoft/edd-core
          path: .edd-core
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: |
            edd-core=.edd-core
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ github.event_name == 'pull_request' && 'type=docker,dest=/tmp/manager-image.tar' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: mcp-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}-mcp-bitbucket
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: images/mcp-bitbucket
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.mcp-meta.outputs.tags }}
          labels: ${{ steps.mcp-meta.outputs.labels }}
          cache-from: type=gha,scope=mcp-bitbucket
          cache-to: type=gha,mode=max,scope=mcp-bitbucket
      - id: mcp-jenkins-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}-mcp-jenkins
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: images/mcp-jenkins
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.mcp-jenkins-meta.outputs.tags }}
          labels: ${{ steps.mcp-jenkins-meta.outputs.labels }}
          cache-from: type=gha,scope=mcp-jenkins
          cache-to: type=gha,mode=max,scope=mcp-jenkins
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: manager-image
          path: /tmp/manager-image.tar
          retention-days: 7

  chart:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "app_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(yq '.version' "$CHART_DIR/Chart.yaml")-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "app_version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - run: |
          helm repo add traefik https://traefik.github.io/charts
          helm dependency build "$CHART_DIR"
      - run: helm lint "$CHART_DIR"
      - run: helm template ci "$CHART_DIR" > /dev/null
      - run: helm package "$CHART_DIR" --version ${{ steps.version.outputs.version }} --app-version ${{ steps.version.outputs.app_version }} --destination dist
      - uses: actions/upload-artifact@v7
        with:
          name: helm-chart
          path: dist/*.tgz
      - name: Push chart to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm push dist/*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
