services:
  traefik:
    image: traefik:v3.7.17
    # Traefik reaches session containers on opencode-sandbox but listens only on its
    # opencode-net address (alias traefik-public), so sandboxes can't send requests through it.
    command:
      - --entrypoints.web.address=traefik-public:80
      - --entrypoints.traefik.address=traefik-public:8080
      - --providers.file.directory=/traefik/dynamic
      - --providers.file.watch=true
      - --api.dashboard=true
      - --api.insecure=true
      - --log.level=INFO
    ports:
      - "8080:80"
      - "127.0.0.1:9090:8080"
    volumes:
      - traefik-dynamic:/traefik/dynamic:ro
    networks:
      opencode-net:
        aliases: [traefik-public]
      opencode-sandbox:
    depends_on:
      - manager
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-no-secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - opencode-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  opencode-dev:
    image: opencode-platform/opencode-dev:1.19.5
    build: ./images/opencode-dev
    profiles: [images]

  manager:
    build:
      context: .
      additional_contexts:
        edd-core: ../edd-core
    environment:
      MANAGER_BACKEND: docker
      MANAGER_ROUTER: traefik-file
      MANAGER_DOMAIN: ${MANAGER_DOMAIN:-localhost}
      MANAGER_PUBLIC_PORT: ${MANAGER_PUBLIC_PORT:-8080}
      MANAGER_DOCKER_SANDBOX_NETWORK: opencode-sandbox
      MANAGER_DOCKER_EGRESS_NETWORK: opencode-egress
      MANAGER_DOCKER_SHARED_VOLUME: opencode-shared
      MANAGER_STORE: postgres
      MANAGER_DATA_DIR: /data
      DatabaseEndpoint: postgres
      DatabasePassword: ${POSTGRES_PASSWORD:-no-secret}
      # Local stack only: username login without a password. Any other
      # deployment uses jwt (the default) with issuer and audience.
      MANAGER_AUTH_MODE: ${MANAGER_AUTH_MODE:-login}
      MANAGER_JWT_JWKS_URL: ${MANAGER_JWT_JWKS_URL:-}
      MANAGER_JWT_SECRET: ${MANAGER_JWT_SECRET:-}
      MANAGER_JWT_ISSUER: ${MANAGER_JWT_ISSUER:-}
      MANAGER_JWT_AUDIENCE: ${MANAGER_JWT_AUDIENCE:-}
      # People and Traefik reach the public listener only on opencode-net,
      # sandboxes reach only the sandbox listener (gateways, result tools,
      # telemetry) as manager:8001 on opencode-sandbox.
      MANAGER_PUBLIC_BIND_HOST: manager-public
      MANAGER_PUBLIC_PORT_INTERNAL: 8000
      MANAGER_MANAGER_SERVICE_URL: http://manager-public:8000
      MANAGER_SANDBOX_BIND_HOST: manager-sandbox
      MANAGER_SANDBOX_PORT: 8001
      MANAGER_SANDBOX_SERVICE_URL: http://manager:8001
      MANAGER_ONBOARDING_URL: ${ONBOARDING_URL:-file:///repos/onboarding}
      MANAGER_REAP_INTERVAL_SECONDS: ${MANAGER_REAP_INTERVAL_SECONDS:-300}
    env_file:
      - path: ./local/manager.env
        required: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./local/secrets:/config/secrets:ro
      - ./local/repos:/repos:ro
      - traefik-dynamic:/traefik/dynamic
      - manager-data:/data
      - opencode-shared:/shared
    networks:
      opencode-net:
        aliases: [manager-public]
      opencode-sandbox:
        aliases: [manager, manager-sandbox]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mcp-bitbucket:
    image: opencode-platform/mcp-bitbucket:dev
    build: ./images/mcp-bitbucket
    read_only: true
    networks: [opencode-net]
    restart: unless-stopped

  mcp-jenkins:
    image: opencode-platform/mcp-jenkins:dev
    build: ./images/mcp-jenkins
    read_only: true
    environment:
      JENKINS_URL: ${JENKINS_URL:-}
    networks: [opencode-net]
    restart: unless-stopped

networks:
  opencode-net:
    name: opencode-net
  opencode-sandbox:
    name: opencode-sandbox
    internal: true
  opencode-egress:
    name: opencode-egress

volumes:
  traefik-dynamic:
  manager-data:
  postgres-data:
  opencode-shared:
    name: opencode-shared
