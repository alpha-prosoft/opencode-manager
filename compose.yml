services:
  traefik:
    image: traefik:v3.7.17
    command:
      - --entrypoints.web.address=:80
      - --providers.file.directory=/traefik/dynamic
      - --providers.file.watch=true
      - --api.dashboard=true
      - --api.insecure=true
      - --log.level=INFO
    ports:
      - "8080:80"
      - "9090:8080"
    volumes:
      - traefik-dynamic:/traefik/dynamic:ro
    networks:
      - opencode-net
    depends_on:
      - manager
    restart: unless-stopped

  temporal:
    image: temporalio/temporal:1.10.0
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db"]
    ports:
      - "8233:8233"
    volumes:
      - temporal-data:/home/temporal
    networks:
      - opencode-net
    restart: unless-stopped

  manager:
    build: ./manager
    environment:
      MANAGER_BACKEND: docker
      MANAGER_ROUTER: traefik-file
      MANAGER_DOMAIN: ${MANAGER_DOMAIN:-localhost}
      MANAGER_PUBLIC_PORT: ${MANAGER_PUBLIC_PORT:-8080}
      MANAGER_DOCKER_NETWORK: opencode-net
      MANAGER_DOCKER_SHARED_VOLUME: opencode-shared
      MANAGER_TEMPORAL_ADDRESS: temporal:7233
      MANAGER_AUTH_MODE: ${MANAGER_AUTH_MODE:-dev}
      MANAGER_JWT_JWKS_URL: ${MANAGER_JWT_JWKS_URL:-}
      MANAGER_JWT_SECRET: ${MANAGER_JWT_SECRET:-}
      MANAGER_SESSION_IMAGE: ${SESSION_IMAGE:-ghcr.io/anomalyco/opencode:1.19.5}
      MANAGER_SESSION_ENV: ${SESSION_ENV:-{}}
      MANAGER_REAP_INTERVAL_SECONDS: ${MANAGER_REAP_INTERVAL_SECONDS:-300}
      MANAGER_IDLE_GRACE_SECONDS: ${MANAGER_IDLE_GRACE_SECONDS:-300}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - traefik-dynamic:/traefik/dynamic
      - manager-data:/data
      - opencode-shared:/shared
    networks:
      - opencode-net
    depends_on:
      - temporal
    restart: unless-stopped

networks:
  opencode-net:
    name: opencode-net

volumes:
  traefik-dynamic:
  manager-data:
  temporal-data:
  opencode-shared:
    name: opencode-shared
