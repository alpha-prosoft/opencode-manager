image:
  repository: ghcr.io/alpha-prosoft/opencode-manager
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Manager UI is served on `domain`; every session on `<sessionId>.<domain>`.
# Point both `domain` and `*.domain` DNS records at the gateway.
domain: opencode.example.com
publicScheme: https
publicPort: null

# login: username-only login form (no password). jwt: identity from an external IdP token.
auth:
  mode: login
  ttlHours: 12
  jwtJwksUrl: ""
  jwtAudience: ""
  jwtSecret:
    existingSecret: ""
    key: jwt-secret

session:
  image: ghcr.io/anomalyco/opencode:1.19.5
  # Environment for every session, e.g. provider API keys. Prefer envSecret for credentials:
  # a Secret whose `key` holds a JSON object of environment variables.
  env: {}
  envSecret:
    name: ""
    key: session-env.json

reaper:
  intervalSeconds: 300
  idleGraceSeconds: 300

# Polls Bitbucket Cloud for new pull requests and creates a public session per PR.
# Enabled when tokenSecret.name, workspace and repos are set. PRs already open on the
# first poll are recorded as a baseline unless backfill is true.
bitbucket:
  workspace: ""
  repos: []
  pollMinutes: 15
  sessionOwner: bitbucket
  backfill: false
  tokenSecret:
    name: ""
    key: token

# Each pull request session runs an OpenCode code review of the change.
# guidelines maps a repository slug to its review baseline (markdown). Keep baselines that contain
# internal knowledge out of Git: helm install ... --set-file review.guidelines.<repo>=<path>
review:
  enabled: true
  # Tried in order; when a model's quota is exhausted the review moves on to the next one.
  models:
    - github-copilot/claude-sonnet-5.5
    - opencode/deepseek-v4.1-flash-free
    - opencode/glm-5.3-flash-free
    - opencode/mimo-v2.6-flash-free
    - opencode/nemotron-3.5-lightning-free
  # off: keep reviews in the session; dry-run: also write .review/post-plan.json; auto: post to the PR.
  postMode: dry-run
  # Upper bound on comments per PR (one summary plus inline comments); the rest is folded into the summary.
  maxComments: 30
  # OpenCode auth.json content (JSON object keyed by provider, e.g. github-copilot oauth or an
  # anthropic api key). Written into a review session only while its review runs.
  modelAuthSecret:
    name: ""
    key: auth.json
  # opencode.json "provider" section for review sessions (base URLs, extra models). No secrets here.
  providerConfig: {}
  guidelines: {}

# One volume shared by all sessions; each session uses the sessions/<id> subpath.
# Session pods can land on any node, so this needs ReadWriteMany storage.
sharedStorage:
  size: 50Gi
  storageClassName: ""
  accessModes: [ReadWriteMany]

managerStorage:
  size: 1Gi
  storageClassName: ""

gateway:
  name: traefik-gateway
  namespace: ""
  sectionName: web

temporalConnection:
  address: temporal-frontend:7233
  namespace: default

temporalPostgres:
  enabled: true
  serviceName: temporal-postgres
  image: postgres:18.6-alpine
  user: temporal
  password: temporal
  storage:
    size: 8Gi
    storageClassName: ""

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}

traefik:
  enabled: true
  providers:
    kubernetesGateway:
      enabled: true
  gateway:
    enabled: true
    name: traefik-gateway

temporal:
  enabled: true
  fullnameOverride: temporal
  schema:
    useHelmHooks: false
  server:
    config:
      persistence:
        datastores:
          default:
            sql:
              pluginName: postgres12
              driverName: postgres12
              databaseName: temporal
              connectAddr: temporal-postgres:5432
              connectProtocol: tcp
              user: temporal
              existingSecret: temporal-postgres
              secretKey: password
              createDatabase: true
              manageSchema: true
              defaultDb: postgres
              maxConns: 20
              maxIdleConns: 20
              maxConnLifetime: 1h
          visibility:
            sql:
              pluginName: postgres12
              driverName: postgres12
              databaseName: temporal_visibility
              connectAddr: temporal-postgres:5432
              connectProtocol: tcp
              user: temporal
              existingSecret: temporal-postgres
              secretKey: password
              createDatabase: true
              manageSchema: true
              defaultDb: postgres
              maxConns: 20
              maxIdleConns: 20
              maxConnLifetime: 1h
      namespaces:
        create: true
        useHelmHooks: false
        namespace:
          - name: default
            retention: 3d
