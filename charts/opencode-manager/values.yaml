image:
  repository: ghcr.io/alpha-prosoft/opencode-manager
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Manager UI is served on `domain`; every session on `<sessionId>.<domain>`.
# Point both `domain` and `*.domain` DNS records at the gateway.
domain: opencode.example.com
publicScheme: https
publicPort: null

# login: username-only login form (no password). jwt: identity from an external IdP token.
auth:
  mode: login
  ttlHours: 12
  jwtJwksUrl: ""
  jwtAudience: ""
  jwtSecret:
    existingSecret: ""
    key: jwt-secret

# Onboarding repository: platform.json lists teams and their repositories (see the README).
onboarding:
  url: ""
  branch: main
  file: platform.json
  # Name of a platform secret (a key of platformSecrets.existingSecret) holding a token for https URLs.
  credentials: ""
  username: x-token-auth
  syncIntervalMinutes: 10

# Kubernetes Secret whose keys are platform secret names (e.g. COPILOT_TOKEN, BITBUCKET_TOKEN).
# Mounted read-only into the manager; never into session pods.
platformSecrets:
  existingSecret: ""

# Default image for sessions; onboarding's allowed_images may permit others.
sessionImage: ghcr.io/anomalyco/opencode:1.19.5

reaper:
  intervalSeconds: 300

# NetworkPolicies isolating session pods: only the manager (LLM gateway, result tools) and the gateway
# reach them, and they reach only the manager unless their harness sets network: internet.
networkPolicies:
  enabled: true
  ingressFrom:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik

# One volume shared by all sessions; each session uses the sessions/<id> subpath.
# Session pods can land on any node, so this needs ReadWriteMany storage.
sharedStorage:
  size: 50Gi
  storageClassName: ""
  accessModes: [ReadWriteMany]

managerStorage:
  size: 1Gi
  storageClassName: ""

gateway:
  name: traefik-gateway
  namespace: ""
  sectionName: web

temporalConnection:
  address: temporal-frontend:7233
  namespace: default

temporalPostgres:
  enabled: true
  serviceName: temporal-postgres
  image: postgres:18.6-alpine
  user: temporal
  password: temporal
  storage:
    size: 8Gi
    storageClassName: ""

resources: {}
# Extra volumes for the manager pod, e.g. a CA bundle or a read-only Git mirror.
extraVolumes: []
extraVolumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}

traefik:
  enabled: true
  providers:
    kubernetesGateway:
      enabled: true
  gateway:
    enabled: true
    name: traefik-gateway

temporal:
  enabled: true
  fullnameOverride: temporal
  schema:
    useHelmHooks: false
  server:
    config:
      persistence:
        datastores:
          default:
            sql:
              pluginName: postgres12
              driverName: postgres12
              databaseName: temporal
              connectAddr: temporal-postgres:5432
              connectProtocol: tcp
              user: temporal
              existingSecret: temporal-postgres
              secretKey: password
              createDatabase: true
              manageSchema: true
              defaultDb: postgres
              maxConns: 20
              maxIdleConns: 20
              maxConnLifetime: 1h
          visibility:
            sql:
              pluginName: postgres12
              driverName: postgres12
              databaseName: temporal_visibility
              connectAddr: temporal-postgres:5432
              connectProtocol: tcp
              user: temporal
              existingSecret: temporal-postgres
              secretKey: password
              createDatabase: true
              manageSchema: true
              defaultDb: postgres
              maxConns: 20
              maxIdleConns: 20
              maxConnLifetime: 1h
      namespaces:
        create: true
        useHelmHooks: false
        namespace:
          - name: default
            retention: 3d
