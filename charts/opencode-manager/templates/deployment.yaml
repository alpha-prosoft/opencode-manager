apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opencode-manager.fullname" . }}
  labels:
    {{- include "opencode-manager.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "opencode-manager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "opencode-manager.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "opencode-manager.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: {{ include "opencode-manager.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
            - name: sandbox
              containerPort: 8001
          env:
            - name: MANAGER_BACKEND
              value: kubernetes
            - name: MANAGER_ROUTER
              value: gateway-api
            - name: MANAGER_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MANAGER_K8S_SHARED_PVC
              value: {{ include "opencode-manager.sharedPvc" . }}
            - name: MANAGER_DOMAIN
              value: {{ .Values.domain | quote }}
            - name: MANAGER_PUBLIC_SCHEME
              value: {{ .Values.publicScheme | quote }}
            {{- with .Values.publicPort }}
            - name: MANAGER_PUBLIC_PORT
              value: {{ . | quote }}
            {{- end }}
            - name: MANAGER_GATEWAY_NAME
              value: {{ .Values.gateway.name | quote }}
            {{- with .Values.gateway.namespace }}
            - name: MANAGER_GATEWAY_NAMESPACE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.gateway.sectionName }}
            - name: MANAGER_GATEWAY_SECTION_NAME
              value: {{ . | quote }}
            {{- end }}
            - name: MANAGER_FORWARD_AUTH_MIDDLEWARE
              value: {{ include "opencode-manager.forwardAuth" . }}
            - name: MANAGER_STRIP_COOKIE_MIDDLEWARE
              value: {{ include "opencode-manager.stripCookie" . }}
            - name: MANAGER_STORE
              value: postgres
            - name: DatabaseEndpoint
              value: {{ .Values.postgres.serviceName | quote }}
            - name: DatabasePassword
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.serviceName }}
                  key: password
            - name: MANAGER_SESSION_IMAGE
              value: {{ .Values.sessionImage | quote }}
            - name: MANAGER_REAP_INTERVAL_SECONDS
              value: {{ .Values.reaper.intervalSeconds | quote }}
            {{- with .Values.onboarding }}
            {{- if .url }}
            - name: MANAGER_ONBOARDING_URL
              value: {{ .url | quote }}
            - name: MANAGER_ONBOARDING_BRANCH
              value: {{ .branch | quote }}
            - name: MANAGER_ONBOARDING_FILE
              value: {{ .file | quote }}
            - name: MANAGER_ONBOARDING_USERNAME
              value: {{ .username | quote }}
            - name: MANAGER_SYNC_INTERVAL_MINUTES
              value: {{ .syncIntervalMinutes | quote }}
            {{- with .credentials }}
            - name: MANAGER_ONBOARDING_CREDENTIALS
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            - name: MANAGER_MANAGER_SERVICE_URL
              value: http://{{ include "opencode-manager.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:8000
            - name: MANAGER_SANDBOX_PORT
              value: "8001"
            - name: MANAGER_SANDBOX_SERVICE_URL
              value: http://{{ include "opencode-manager.sandboxService" . }}.{{ .Release.Namespace }}.svc.cluster.local:8001
            - name: MANAGER_AUTH_MODE
              value: {{ .Values.auth.mode | quote }}
            - name: MANAGER_AUTH_TTL_HOURS
              value: {{ .Values.auth.ttlHours | quote }}
            {{- if eq .Values.auth.mode "jwt" }}
            - name: MANAGER_JWT_ISSUER
              value: {{ required "auth.jwtIssuer is required when auth.mode is jwt" .Values.auth.jwtIssuer | quote }}
            - name: MANAGER_JWT_AUDIENCE
              value: {{ required "auth.jwtAudience is required when auth.mode is jwt" .Values.auth.jwtAudience | quote }}
            - name: MANAGER_JWT_COOKIE
              value: {{ .Values.auth.jwtCookie | quote }}
            {{- end }}
            {{- with .Values.auth.jwtJwksUrl }}
            - name: MANAGER_JWT_JWKS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.credentialsKey.existingSecret }}
            - name: MANAGER_CREDENTIALS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsKey.existingSecret }}
                  key: {{ .Values.credentialsKey.key }}
            {{- end }}
            {{- if .Values.auth.jwtSecret.existingSecret }}
            - name: MANAGER_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.jwtSecret.existingSecret }}
                  key: {{ .Values.auth.jwtSecret.key }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: data
              mountPath: /data
            - name: shared
              mountPath: /shared
            - name: platform-secrets
              mountPath: /config/secrets
              readOnly: true
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - name: platform-secrets
          secret:
            secretName: {{ .Values.platformSecrets.existingSecret | default (printf "%s-platform-secrets" (include "opencode-manager.fullname" .)) }}
            optional: true
            defaultMode: 0400
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "opencode-manager.fullname" . }}-data
        - name: shared
          persistentVolumeClaim:
            claimName: {{ include "opencode-manager.sharedPvc" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opencode-manager.fullname" . }}
  labels:
    {{- include "opencode-manager.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "opencode-manager.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
---
# Sandbox-facing listener (LLM and MCP gateways, result tools, telemetry). No route exposes it;
# only session pods may reach it (see networkpolicy.yaml).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opencode-manager.sandboxService" . }}
  labels:
    {{- include "opencode-manager.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "opencode-manager.selectorLabels" . | nindent 4 }}
  ports:
    - name: sandbox
      port: 8001
      targetPort: sandbox
