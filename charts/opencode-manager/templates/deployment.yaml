apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opencode-manager.fullname" . }}
  labels:
    {{- include "opencode-manager.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "opencode-manager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "opencode-manager.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "opencode-manager.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: {{ include "opencode-manager.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
            - name: sandbox
              containerPort: 8001
          env:
            - name: MANAGER_BACKEND
              value: kubernetes
            - name: MANAGER_ROUTER
              value: gateway-api
            - name: MANAGER_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MANAGER_K8S_SHARED_PVC
              value: {{ include "opencode-manager.sharedPvc" . }}
            - name: MANAGER_DOMAIN
              value: {{ .Values.domain | quote }}
            - name: MANAGER_PUBLIC_SCHEME
              value: {{ .Values.publicScheme | quote }}
            {{- with .Values.publicPort }}
            - name: MANAGER_PUBLIC_PORT
              value: {{ . | quote }}
            {{- end }}
            - name: MANAGER_GATEWAY_NAME
              value: {{ .Values.gateway.name | quote }}
            {{- with .Values.gateway.namespace }}
            - name: MANAGER_GATEWAY_NAMESPACE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.gateway.sectionName }}
            - name: MANAGER_GATEWAY_SECTION_NAME
              value: {{ . | quote }}
            {{- end }}
            - name: MANAGER_FORWARD_AUTH_MIDDLEWARE
              value: {{ include "opencode-manager.forwardAuth" . }}
            - name: MANAGER_STRIP_COOKIE_MIDDLEWARE
              value: {{ include "opencode-manager.stripCookie" . }}
            - name: MANAGER_STORE
              value: postgres
            - name: DatabaseEndpoint
              value: {{ .Values.postgres.serviceName | quote }}
            - name: DatabasePassword
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.serviceName }}
                  key: password
            - name: MANAGER_SESSION_IMAGE
              value: {{ .Values.sessionImage | quote }}
            - name: MANAGER_REAP_INTERVAL_SECONDS
              value: {{ .Values.reaper.intervalSeconds | quote }}
            {{- if .Values.tenantsFile.configMap }}
            - name: MANAGER_TENANTS_FILE
              value: /config/tenants/{{ .Values.tenantsFile.key }}
            {{- else }}
            - name: MANAGER_TENANTS
              value: {{ .Values.tenants | toJson | quote }}
            {{- end }}
            - name: MANAGER_OPERATORS
              value: {{ join "," .Values.operators | quote }}
            - name: MANAGER_SYNC_INTERVAL_MINUTES
              value: {{ .Values.syncIntervalMinutes | quote }}
            {{- with .Values.httpGitHosts }}
            - name: MANAGER_HTTP_GIT_HOSTS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.trustedProxies }}
            - name: MANAGER_TRUSTED_PROXIES
              value: {{ join "," . | quote }}
            {{- end }}
            - name: MANAGER_CLAIMS_PARSER
              value: {{ .Values.claims.parser | quote }}
            {{- if .Values.claims.parserFile.configMap }}
            - name: MANAGER_CLAIMS_PARSER_FILE
              value: /config/claims/{{ .Values.claims.parserFile.key }}
            {{- end }}
            {{- if and (eq .Values.auth.mode "login") .Values.claims.devUsers.configMap }}
            - name: MANAGER_DEV_USERS_FILE
              value: /config/dev-users/{{ .Values.claims.devUsers.key }}
            {{- end }}
            - name: MANAGER_MANAGER_SERVICE_URL
              value: http://{{ include "opencode-manager.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:8000
            - name: MANAGER_SANDBOX_PORT
              value: "8001"
            - name: MANAGER_SANDBOX_SERVICE_URL
              value: http://{{ include "opencode-manager.sandboxService" . }}.{{ .Release.Namespace }}.svc.cluster.local:8001
            - name: MANAGER_AUTH_MODE
              value: {{ .Values.auth.mode | quote }}
            - name: MANAGER_AUTH_TTL_HOURS
              value: {{ .Values.auth.ttlHours | quote }}
            {{- if eq .Values.auth.mode "jwt" }}
            {{- if not (or .Values.auth.jwtIssuer .Values.auth.jwtDiscoveryUrl) }}
            {{- fail "auth.jwtIssuer or auth.jwtDiscoveryUrl is required when auth.mode is jwt" }}
            {{- end }}
            {{- with .Values.auth.jwtIssuer }}
            - name: MANAGER_JWT_ISSUER
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.auth.jwtDiscoveryUrl }}
            - name: MANAGER_JWT_DISCOVERY_URL
              value: {{ . | quote }}
            {{- end }}
            - name: MANAGER_JWT_AUDIENCE
              value: {{ required "auth.jwtAudience is required when auth.mode is jwt" .Values.auth.jwtAudience | quote }}
            - name: MANAGER_JWT_COOKIE
              value: {{ .Values.auth.jwtCookie | quote }}
            {{- end }}
            {{- if eq .Values.auth.mode "oidc" }}
            {{- if not (or .Values.auth.oidc.issuer .Values.auth.oidc.discoveryUrl) }}
            {{- fail "auth.oidc.issuer or auth.oidc.discoveryUrl is required when auth.mode is oidc" }}
            {{- end }}
            {{- with .Values.auth.oidc.issuer }}
            - name: MANAGER_OIDC_ISSUER
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.auth.oidc.discoveryUrl }}
            - name: MANAGER_OIDC_DISCOVERY_URL
              value: {{ . | quote }}
            {{- end }}
            - name: MANAGER_OIDC_CLIENT_ID
              value: {{ required "auth.oidc.clientId is required when auth.mode is oidc" .Values.auth.oidc.clientId | quote }}
            {{- if .Values.auth.oidc.clientSecret.existingSecret }}
            - name: MANAGER_OIDC_CLIENT_SECRET_FILE
              value: /config/oidc/{{ .Values.auth.oidc.clientSecret.key }}
            {{- end }}
            - name: MANAGER_OIDC_SCOPES
              value: {{ .Values.auth.oidc.scopes | quote }}
            {{- with .Values.auth.oidc.redirectUrl }}
            - name: MANAGER_OIDC_REDIRECT_URL
              value: {{ . | quote }}
            {{- end }}
            - name: MANAGER_OIDC_CLAIMS_SOURCE
              value: {{ .Values.auth.oidc.claimsSource | quote }}
            {{- end }}
            {{- with .Values.auth.jwtJwksUrl }}
            - name: MANAGER_JWT_JWKS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if or (eq .Values.auth.mode "jwt") (eq .Values.auth.mode "oidc") }}
            {{- $keys := ternary "MANAGER_OIDC_JWKS" "MANAGER_JWT_JWKS" (eq .Values.auth.mode "oidc") }}
            {{- with .Values.auth.jwks.file }}
            - name: {{ $keys }}_FILE
              value: {{ . | quote }}
            {{- end }}
            - name: {{ $keys }}_REFRESH_SECONDS
              value: {{ .Values.auth.jwks.refreshSeconds | quote }}
            - name: {{ $keys }}_REFRESH_RETRY_SECONDS
              value: {{ .Values.auth.jwks.refreshRetrySeconds | quote }}
            {{- with .Values.auth.jwks.defaultAlgorithm }}
            - name: {{ $keys }}_DEFAULT_ALGORITHM
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            - name: MANAGER_CONFIG_RELOAD_SECONDS
              value: {{ .Values.configReloadSeconds | quote }}
            {{- if .Values.credentialsKey.existingSecret }}
            - name: MANAGER_CREDENTIALS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsKey.existingSecret }}
                  key: {{ .Values.credentialsKey.key }}
            {{- end }}
            {{- if .Values.auth.jwtSecret.existingSecret }}
            - name: MANAGER_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.jwtSecret.existingSecret }}
                  key: {{ .Values.auth.jwtSecret.key }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: data
              mountPath: /data
            - name: shared
              mountPath: /shared
            - name: platform-secrets
              mountPath: /config/secrets
              readOnly: true
            {{- if .Values.tenantsFile.configMap }}
            - name: tenants
              mountPath: /config/tenants
              readOnly: true
            {{- end }}
            {{- if .Values.claims.parserFile.configMap }}
            - name: claims-parser
              mountPath: /config/claims
              readOnly: true
            {{- end }}
            {{- if and (eq .Values.auth.mode "login") .Values.claims.devUsers.configMap }}
            - name: dev-users
              mountPath: /config/dev-users
              readOnly: true
            {{- end }}
            {{- if and (eq .Values.auth.mode "oidc") .Values.auth.oidc.clientSecret.existingSecret }}
            - name: oidc-client-secret
              mountPath: /config/oidc
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.tenantsFile.configMap }}
        - name: tenants
          configMap:
            name: {{ .Values.tenantsFile.configMap }}
            items:
              - key: {{ .Values.tenantsFile.key }}
                path: {{ .Values.tenantsFile.key }}
        {{- end }}
        {{- if .Values.claims.parserFile.configMap }}
        - name: claims-parser
          configMap:
            name: {{ .Values.claims.parserFile.configMap }}
            items:
              - key: {{ .Values.claims.parserFile.key }}
                path: {{ .Values.claims.parserFile.key }}
        {{- end }}
        {{- if and (eq .Values.auth.mode "login") .Values.claims.devUsers.configMap }}
        - name: dev-users
          configMap:
            name: {{ .Values.claims.devUsers.configMap }}
            items:
              - key: {{ .Values.claims.devUsers.key }}
                path: {{ .Values.claims.devUsers.key }}
        {{- end }}
        {{- if and (eq .Values.auth.mode "oidc") .Values.auth.oidc.clientSecret.existingSecret }}
        - name: oidc-client-secret
          secret:
            secretName: {{ .Values.auth.oidc.clientSecret.existingSecret }}
            defaultMode: 0400
            items:
              - key: {{ .Values.auth.oidc.clientSecret.key }}
                path: {{ .Values.auth.oidc.clientSecret.key }}
        {{- end }}
        - name: platform-secrets
          secret:
            secretName: {{ .Values.platformSecrets.existingSecret | default (printf "%s-platform-secrets" (include "opencode-manager.fullname" .)) }}
            optional: true
            defaultMode: 0400
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "opencode-manager.fullname" . }}-data
        - name: shared
          persistentVolumeClaim:
            claimName: {{ include "opencode-manager.sharedPvc" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opencode-manager.fullname" . }}
  labels:
    {{- include "opencode-manager.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "opencode-manager.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
---
# Sandbox-facing listener (LLM and MCP gateways, result tools, telemetry). No route exposes it;
# only session pods may reach it (see networkpolicy.yaml).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opencode-manager.sandboxService" . }}
  labels:
    {{- include "opencode-manager.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "opencode-manager.selectorLabels" . | nindent 4 }}
  ports:
    - name: sandbox
      port: 8001
      targetPort: sandbox
