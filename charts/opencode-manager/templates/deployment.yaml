apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opencode-manager.fullname" . }}
  labels:
    {{- include "opencode-manager.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "opencode-manager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "opencode-manager.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "opencode-manager.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: {{ include "opencode-manager.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MANAGER_BACKEND
              value: kubernetes
            - name: MANAGER_ROUTER
              value: gateway-api
            - name: MANAGER_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MANAGER_K8S_SHARED_PVC
              value: {{ include "opencode-manager.sharedPvc" . }}
            - name: MANAGER_DOMAIN
              value: {{ .Values.domain | quote }}
            - name: MANAGER_PUBLIC_SCHEME
              value: {{ .Values.publicScheme | quote }}
            {{- with .Values.publicPort }}
            - name: MANAGER_PUBLIC_PORT
              value: {{ . | quote }}
            {{- end }}
            - name: MANAGER_GATEWAY_NAME
              value: {{ .Values.gateway.name | quote }}
            {{- with .Values.gateway.namespace }}
            - name: MANAGER_GATEWAY_NAMESPACE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.gateway.sectionName }}
            - name: MANAGER_GATEWAY_SECTION_NAME
              value: {{ . | quote }}
            {{- end }}
            - name: MANAGER_FORWARD_AUTH_MIDDLEWARE
              value: {{ include "opencode-manager.forwardAuth" . }}
            - name: MANAGER_TEMPORAL_ADDRESS
              value: {{ .Values.temporalConnection.address | quote }}
            - name: MANAGER_TEMPORAL_NAMESPACE
              value: {{ .Values.temporalConnection.namespace | quote }}
            - name: MANAGER_SESSION_IMAGE
              value: {{ .Values.session.image | quote }}
            - name: MANAGER_SESSION_ENV
              {{- if .Values.session.envSecret.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.session.envSecret.name }}
                  key: {{ .Values.session.envSecret.key }}
              {{- else }}
              value: {{ .Values.session.env | toJson | quote }}
              {{- end }}
            - name: MANAGER_REAP_INTERVAL_SECONDS
              value: {{ .Values.reaper.intervalSeconds | quote }}
            - name: MANAGER_IDLE_GRACE_SECONDS
              value: {{ .Values.reaper.idleGraceSeconds | quote }}
            {{- if and .Values.bitbucket.tokenSecret.name .Values.bitbucket.workspace .Values.bitbucket.repos }}
            - name: MANAGER_BITBUCKET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bitbucket.tokenSecret.name }}
                  key: {{ .Values.bitbucket.tokenSecret.key }}
            - name: MANAGER_BITBUCKET_WORKSPACE
              value: {{ .Values.bitbucket.workspace | quote }}
            - name: MANAGER_BITBUCKET_REPOS
              value: {{ .Values.bitbucket.repos | toJson | quote }}
            - name: MANAGER_BITBUCKET_POLL_MINUTES
              value: {{ .Values.bitbucket.pollMinutes | quote }}
            - name: MANAGER_BITBUCKET_SESSION_OWNER
              value: {{ .Values.bitbucket.sessionOwner | quote }}
            - name: MANAGER_BITBUCKET_BACKFILL
              value: {{ .Values.bitbucket.backfill | quote }}
            {{- end }}
            - name: MANAGER_REVIEW_ENABLED
              value: {{ .Values.review.enabled | quote }}
            - name: MANAGER_REVIEW_MODELS
              value: {{ .Values.review.models | toJson | quote }}
            - name: MANAGER_REVIEW_POST_MODE
              value: {{ .Values.review.postMode | quote }}
            - name: MANAGER_REVIEW_MAX_COMMENTS
              value: {{ .Values.review.maxComments | quote }}
            - name: MANAGER_MANAGER_SERVICE_URL
              value: http://{{ include "opencode-manager.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:8000
            - name: MANAGER_AUTH_MODE
              value: {{ .Values.auth.mode | quote }}
            - name: MANAGER_AUTH_TTL_HOURS
              value: {{ .Values.auth.ttlHours | quote }}
            {{- with .Values.auth.jwtJwksUrl }}
            - name: MANAGER_JWT_JWKS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.auth.jwtAudience }}
            - name: MANAGER_JWT_AUDIENCE
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.auth.jwtSecret.existingSecret }}
            - name: MANAGER_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.jwtSecret.existingSecret }}
                  key: {{ .Values.auth.jwtSecret.key }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: data
              mountPath: /data
            - name: shared
              mountPath: /shared
            - name: review-guidelines
              mountPath: /config/review
              readOnly: true
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: review-guidelines
          configMap:
            name: {{ include "opencode-manager.fullname" . }}-review
            optional: true
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "opencode-manager.fullname" . }}-data
        - name: shared
          persistentVolumeClaim:
            claimName: {{ include "opencode-manager.sharedPvc" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opencode-manager.fullname" . }}
  labels:
    {{- include "opencode-manager.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "opencode-manager.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
