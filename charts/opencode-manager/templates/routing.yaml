apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "opencode-manager.forwardAuth" . }}
  labels:
    {{- include "opencode-manager.labels" . | nindent 4 }}
spec:
  forwardAuth:
    address: http://{{ include "opencode-manager.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:8000/api/gateway/auth
    authResponseHeaders:
      - Authorization
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "opencode-manager.fullname" . }}
  labels:
    {{- include "opencode-manager.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- include "opencode-manager.gatewayParentRef" . | nindent 4 }}
  hostnames:
    - {{ .Values.domain | quote }}
  rules:
    - backendRefs:
        - name: {{ include "opencode-manager.fullname" . }}
          port: 8000
---
# Catches session hosts whose own route is not active (e.g. scaled to zero) so the manager can wake them.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "opencode-manager.fullname" . }}-wake
  labels:
    {{- include "opencode-manager.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- include "opencode-manager.gatewayParentRef" . | nindent 4 }}
  hostnames:
    - {{ printf "*.%s" .Values.domain | quote }}
  rules:
    - backendRefs:
        - name: {{ include "opencode-manager.fullname" . }}
          port: 8000
