{{- if .Values.postgres.enabled }}
{{- $pg := .Values.postgres }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $pg.serviceName }}
  labels:
    {{- include "opencode-manager.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $pg.password | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $pg.serviceName }}
  labels:
    {{- include "opencode-manager.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ $pg.serviceName }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $pg.serviceName }}
  labels:
    {{- include "opencode-manager.labels" . | nindent 4 }}
spec:
  serviceName: {{ $pg.serviceName }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $pg.serviceName }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $pg.serviceName }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: postgres
          image: {{ $pg.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $pg.serviceName }}
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $pg.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $pg.storage.size }}
{{- end }}
