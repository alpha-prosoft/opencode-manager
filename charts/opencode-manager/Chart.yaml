apiVersion: v2
name: opencode-manager
description: Per-user OpenCode web sessions managed by a FastAPI manager, routed through Traefik and the Gateway API
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  - name: traefik
    version: 42.3.0
    repository: https://traefik.github.io/charts
    condition: traefik.enabled
  - name: temporal
    version: 1.8.0
    repository: https://go.temporal.io/helm-charts
    condition: temporal.enabled
